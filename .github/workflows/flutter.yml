name: UserInfo Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: userinfo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding and restore CSV bridge
        shell: bash
        run: |
          set -euo pipefail
          flutter create . --platforms=android --org com.amindada021 --no-pub
          mkdir -p android/app/src/main/kotlin/com/amindada021/userinfo
          cp platform_templates/MainActivity.kt android/app/src/main/kotlin/com/amindada021/userinfo/MainActivity.kt
          cp platform_templates/ImportForegroundService.kt android/app/src/main/kotlin/com/amindada021/userinfo/ImportForegroundService.kt
          cp platform_templates/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Generate UserInfo brand logo and launcher icons
        run: python3 tool/generate_logo.py

      - name: Bundle Persian PDF font and OFL license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          curl -fL --retry 3 -o assets/fonts/Lateef-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/lateef/Lateef-Regular.ttf
          curl -fL --retry 3 -o assets/fonts/OFL.txt https://raw.githubusercontent.com/google/fonts/main/ofl/lateef/OFL.txt
          test "$(wc -c < assets/fonts/Lateef-Regular.ttf)" -gt 100000

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Synthetic database benchmark
        run: flutter test test/database_benchmark_test.dart --dart-define=USERINFO_RUN_BENCHMARK=true

      - name: Synthetic complete import benchmark
        run: flutter test test/import_benchmark_test.dart --dart-define=USERINFO_RUN_BENCHMARK=true

      - name: Synthetic parser benchmark
        run: dart run tool/benchmarks/parser_benchmark.dart 1000000

      - name: Read semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION="$(awk '/^version:/ { print $2 }' pubspec.yaml)"
          VERSION="${FULL_VERSION%%+*}"
          BUILD_NUMBER="${FULL_VERSION##*+}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid pubspec.yaml version; expected 0.1.0+1"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure stable Android signing when secrets are available
        id: signing
        shell: bash
        env:
          USERINFO_ANDROID_KEYSTORE_B64: ${{ secrets.USERINFO_ANDROID_KEYSTORE_B64 }}
          USERINFO_ANDROID_KEY_ALIAS: ${{ secrets.USERINFO_ANDROID_KEY_ALIAS }}
          USERINFO_ANDROID_KEY_PASSWORD: ${{ secrets.USERINFO_ANDROID_KEY_PASSWORD }}
          USERINFO_ANDROID_STORE_PASSWORD: ${{ secrets.USERINFO_ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_VALUES=("$USERINFO_ANDROID_KEYSTORE_B64" "$USERINFO_ANDROID_KEY_ALIAS" "$USERINFO_ANDROID_KEY_PASSWORD" "$USERINFO_ANDROID_STORE_PASSWORD")
          PRESENT=0
          for value in "${SIGNING_VALUES[@]}"; do
            [[ -z "$value" ]] || PRESENT=$((PRESENT + 1))
          done
          if [[ "$PRESENT" == 0 ]]; then
            # PR validation can use an ephemeral key, but never publish APKs
            # signed by the runner's disposable debug certificate.
            if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "::error::Release signing is NOT configured. Publishing would force users to uninstall and lose app data. Configure the four USERINFO_ANDROID_* Actions secrets per docs/ANDROID_SIGNING_AND_TRANSFER.md."
              exit 1
            fi
            echo "mode=temporary-debug" >> "$GITHUB_OUTPUT"
            echo "::warning::PR test build only; debug signing is not for distribution."
            exit 0
          fi
          if [[ "$PRESENT" != 4 ]]; then
            echo "::error::Configure all four USERINFO_ANDROID_* secrets or none."
            exit 1
          fi
          printf '%s' "$USERINFO_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/userinfo-release.jks
          chmod 600 android/app/userinfo-release.jks
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          expected = 'signingConfig = signingConfigs.getByName("debug")'
          if expected not in text:
              raise SystemExit('Expected Flutter default release signing line not found')
          config = """
              signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("USERINFO_ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("USERINFO_ANDROID_KEY_PASSWORD")
                      storeFile = file("userinfo-release.jks")
                      storePassword = System.getenv("USERINFO_ANDROID_STORE_PASSWORD")
                  }
              }
          """
          text = text.replace('    buildTypes {', config + '    buildTypes {', 1)
          text = text.replace(expected, 'signingConfig = signingConfigs.getByName("release")', 1)
          gradle.write_text(text)
          PY
          echo "mode=persistent" >> "$GITHUB_OUTPUT"

      # Never distribute randomly debug-signed builds from main.
      # Users have lost on-device SQLite data after being forced to uninstall
      # an incompatible signature. PRs may still exercise debug-signed builds.
      - name: Require permanent APK signing for main
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.mode != 'persistent'
        shell: bash
        run: |
          echo "::error::Release blocked: stable Android signing secrets are missing."
          echo "::error::Set all four USERINFO_ANDROID_* GitHub Actions secrets according to docs/ANDROID_SIGNING_AND_TRANSFER.md."
          echo "::error::Do not uninstall the existing app unless a separate backup has been successfully restored and verified."
          exit 1

      - name: Build release APK
        shell: bash
        env:
          USERINFO_ANDROID_KEY_ALIAS: ${{ secrets.USERINFO_ANDROID_KEY_ALIAS }}
          USERINFO_ANDROID_KEY_PASSWORD: ${{ secrets.USERINFO_ANDROID_KEY_PASSWORD }}
          USERINFO_ANDROID_STORE_PASSWORD: ${{ secrets.USERINFO_ANDROID_STORE_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build_number }}"

      - name: Verify permanent APK signature for releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.mode }}" != "persistent" ]]; then
            echo "::error::Refusing to distribute a non-persistently signed APK."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare versioned files and SHA256
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-release.apk "UserInfo-v$VERSION.apk"
          cp "UserInfo-v$VERSION.apk" "UserInfo-latest.apk"
          sha256sum "UserInfo-v$VERSION.apk" > "UserInfo-v$VERSION.apk.sha256"
          sha256sum "UserInfo-latest.apk" > "UserInfo-latest.apk.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UserInfo-v${{ steps.version.outputs.version }}
          path: |
            UserInfo-v${{ steps.version.outputs.version }}.apk
            UserInfo-v${{ steps.version.outputs.version }}.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish version to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.signing.outputs.mode == 'persistent'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Increase pubspec.yaml version to publish a new release."
            exit 0
          fi
          cat > release-notes.md <<EOF
          UserInfo $TAG — اپ اندروید آفلاین (نسخه آزمایشی).

          - دانلود برای گوشی: UserInfo-latest.apk
          - دانلود آرشیوی نسخه: UserInfo-v$VERSION.apk
          - فایل‌های SHA256 برای اعتبارسنجی دانلود ارائه شده‌اند.
          - دیتابیس نسخه فعلی هنوز رمزگذاری‌شده نیست؛ **برای تست فقط از داده ساختگی استفاده کنید**.
          - حالت امضای APK: ${{ steps.signing.outputs.mode }}.
          - اگر نصب به علت امضای متفاوت رد شد، نسخه قبلی را بدون بکاپ SQLite حذف نکنید. فایل بکاپ را پیش از پاک کردن نسخه موجود روی دستگاه دیگری آزمون کنید.
          - راهنمای کلید امضای ثابت، انتقال بکاپ و مهاجرت یکباره: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/ANDROID_SIGNING_AND_TRANSFER.md
          - جستجوی پیشوندی ایندکس‌شده، صفحه‌بندی Cursor، درج گروهی و ادامه فایل‌های شروع‌شده در نسخه جدید اضافه شده‌اند.
          - تا تکمیل ایندکس، نتایج فقط شامل بخش ایندکس‌شده‌اند.
          - عملکرد ۱۰۰ میلیون رکورد و سرعت POCO هنوز تأیید نشده است.
          - گزارش و روش تست: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/PERFORMANCE_2026-10-22.md
          EOF
          gh release create "$TAG" \
            "UserInfo-v$VERSION.apk" "UserInfo-v$VERSION.apk.sha256" \
            "UserInfo-latest.apk" "UserInfo-latest.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "UserInfo $TAG" \
            --notes-file release-notes.md \
            --latest
