name: userinfo
description: Offline Persian CSV database viewer for Android.
publish_to: none
version: 0.1.4+5

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  cross_file: ^0.3.5
  archive: ^3.6.1
  excel: ^4.0.6
  printing: ^5.14.3
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
